services:
  - type: web
    name: phu-de-api
    runtime: docker
    region: singapore
    # Free tier: $0, 0.1 CPU / 512 MB RAM. Suitable for testing and small jobs only.
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://0cuong.github.io
      - key: GEMINI_API_KEY
        sync: false
